services:
  digitalhomelibrary.book:
    container_name: book_service
    image: ${DOCKER_REGISTRY-}digitalhomelibrarybookservice
    build:
      context: .
      dockerfile: DigitalHomeLibrary.BookService/Dockerfile
    depends_on:
      - postgres
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8070
      - ASPNETCORE_HTTPS_PORTS=8071
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
    ports:
      - 8070:8070
      - 8071:8071 
    networks:
      - postgres

  digitalhomelibrary.content:
    container_name: content_service
    image: ${DOCKER_REGISTRY-}digitalhomelibrarycontentservice
    build:
      context: .
      dockerfile: DigitalHomeLibrary.ContentService/Dockerfile
    depends_on:
      - postgres
      - minio
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8060
      - ASPNETCORE_HTTPS_PORTS=8061
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
    ports:
      - 8060:8060
      - 8061:8061
    networks:
      - postgres
      - minio

  postgres:
    container_name: postgres
    image: postgres:14
    environment:
      POSTGRES_MULTIPLE_DATABASES: "book_db:book_db:book_db,content_db:content_db:content_db"
      POSTGRES_USER: main_user
      POSTGRES_PASSWORD: hnrsygtgr
      PGDATA: /data/postgres
    volumes:
       - postgres:/data/postgres
       - ./init_db:/docker-entrypoint-initdb.d
    expose:
      - 5432
    networks:
      - postgres
    restart: unless-stopped

  minio:
    container_name: minio
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server --console-address ":9001" /data/minio
    ports:
      - 9001:9001
    expose:
      - 9000
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio:/data/minio
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - minio


networks:
  postgres:
  minio:
    driver: bridge

volumes:
    postgres:
    minio:
