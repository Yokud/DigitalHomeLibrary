services:
  digitalhomelibrary.trackingbooks:
    image: ${DOCKER_REGISTRY-}digitalhomelibrarytrackingbooks
    build:
      context: .
      dockerfile: DigitalHomeLibrary.TrackingBooks/Dockerfile
    networks:
      - postgres

  digitalhomelibrary.digitalbooksstorage:
    image: ${DOCKER_REGISTRY-}digitalhomelibrarydigitalbooksstorage
    build:
      context: .
      dockerfile: DigitalHomeLibrary.DigitalBooksStorage/Dockerfile
    networks:
      - postgres
      - minio

  postgres:
    container_name: postgres_container
    image: postgres:14
    environment:
      POSTGRES_USER: books_tracker
      POSTGRES_PASSWORD: hnrsygtgr
      POSTGRES_DB: BooksDB
      PGDATA: /data/postgres
    volumes:
       - postgres:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - postgres
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z
    command: server --console-address ":9001" http://minio/data
    expose:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    hostname: minio
    volumes:
      - minio:/data/minio
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - minio

networks:
  postgres:
    driver: bridge
  minio:
    driver: bridge

volumes:
    postgres:
    minio:
