services:
  digitalhomelibrary.book:
    image: ${DOCKER_REGISTRY-}digitalhomelibrarybookservice
    build:
      context: .
      dockerfile: DigitalHomeLibrary.BookService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8070
      - ASPNETCORE_HTTPS_PORTS=8071
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
    ports:
      - 8070:8070
      - 8071:8071 
    networks:
      - postgres

  digitalhomelibrary.content:
    image: ${DOCKER_REGISTRY-}digitalhomelibrarycontentservice
    build:
      context: .
      dockerfile: DigitalHomeLibrary.ContentService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8060
      - ASPNETCORE_HTTPS_PORTS=8061
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
    ports:
      - 8060:8060
      - 8061:8061
    networks:
      - postgres
      - minio

  postgres:
    container_name: postgres_container
    image: postgres:14
    environment:
      POSTGRES_USER: books_tracker
      POSTGRES_PASSWORD: hnrsygtgr
      POSTGRES_DB: BooksDB
      PGDATA: /data/postgres
    volumes:
       - postgres:/data/postgres
    expose:
      - 5432
    networks:
      - postgres
    restart: unless-stopped

  minio:
    container_name: minio
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server --console-address ":9001" /data/minio
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio:/data/minio
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - minio

  minio-buckets:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      sleep 20;
      /usr/bin/mc alias set dockerminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb dockerminio/digitalbooks;
      exit 0;
      "


networks:
  postgres:
    driver: bridge
  minio:
    driver: bridge

volumes:
    postgres:
    minio:
